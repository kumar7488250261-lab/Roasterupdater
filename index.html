document.querySelectorAll('.f').forEach(f=>{const k=f.dataset.k,i=f.querySelector('input'),dd=f.querySelector('.dd');
const add=p=>{if(!S[k].some(x=>x[0]==p[0]))S[k].push(p);i.value='';dd.style.display='none';draw(f)};
i.oninput=()=>{const q=i.value.trim().toLowerCase();if(!q){dd.style.display='none';return}
const r=D.filter(p=>p[0].toLowerCase().includes(q)||p[1].includes(q)).slice(0,8);dd.innerHTML='';
r.forEach(p=>{const d=document.createElement('div');d.innerHTML=`<span>${p[0]}</span><small>${p[2]} · ${p[1]}</small>`;d.onmousedown=d.ontouchstart=e=>{e.preventDefault();add(p)};dd.appendChild(d)});
dd.style.display=r.length?'block':'none'};
i.onkeydown=e=>{if(e.key=='Enter'&&i.value.trim()){e.preventDefault();const m=D.filter(p=>p[0].toLowerCase().includes(i.value.trim().toLowerCase()));add(m[0]||[i.value.trim().toUpperCase(),'',''])}};
i.onblur=()=>setTimeout(()=>dd.style.display='none',150)});
let msg='';
$('#upd').onclick=()=>{const [y,m,d]=dt.value.split('-');
const L='━━━━━━━━━━━━━━━',ic={TFR:'🟦',LH:'🟩',DI:'🟧',WD:'🟪'};
msg=`🚆 ${L} 🚆\n      *KHARSIA LOBBY*\n      *ROASTER UPDATE*\n🚆 ${L} 🚆\n\n📅 *Date:* ${d}-${m}-${y}\n⏰ *Shift:* ${$('#shift').value}\n\n${L}\n`;
for(const k in S){msg+=`\n${ic[k]} *${k}*\n`+(S[k].length?S[k].map(p=>`   👤 ${p[0]}${p[1]?'\n   📞 '+p[1]:''}`).join('\n\n'):'   ➖')+'\n'}
msg+=`\n${L}\n✅ _Kharsia Lobby - Roaster Updated_`;
$('#txt').textContent=msg.replace(/[*_]/g,'');$('#out').style.display='block';$('#out').scrollIntoView({behavior:'smooth'})};
$('#wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(msg);$('#cp').textContent='Copied ✓'}catch(e){}};
</script></body></html>
